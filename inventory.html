<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>inventory</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        body {
            background-image: url("assets/ui/background.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            color: white;
            font-family: Arial, sans-serif;
        }

        #back {
            position: absolute;
            top: 20px;
            left: 20px;

            font-size: 32px;
            color: white;
            text-decoration: none;

            z-index: 20;
        }

        #tabs {
            position: absolute;
            top: 20px;
            left: 50%;

            transform: translateX(-50%);

            display: flex;
            gap: 30px;

            font-size: 24px;
            font-weight: bold;
        }

        .tab {
            cursor: pointer;
            opacity: 0.5;
        }

        .tab.active {
            opacity: 1;
        }

        #inventory {
            position: absolute;

            top: 90px;
            left: 50%;
            transform: translateX(-50%);

            width: 90%;
            height: calc(100% - 110px);

            overflow-y: auto;
            overflow-x: hidden;

            padding: 20px;
        }

        .rarity {
            margin-bottom: 30px;
        }

        .rarityTitle {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .items {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
        }

        .item {
            width: 100px;

            text-align: center;
            cursor: pointer;
        }

        .item img {
            width: 80px;
            height: 80px;

            object-fit: contain;

            display: block;
            margin: auto;
        }

        .itemName {
            margin-top: 8px;

            font-size: 16px;
            font-weight: bold;

            word-break: break-word;
        }

        .selected {
            outline: 2px solid white;
            outline-offset: 5px;
        }


        /* Preview */

        #preview {
            position: absolute;

            right: 30px;
            bottom: 30px;

            width: 180px;
            height: 180px;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        #previewCharacter {
            position: absolute;

            width: 130px;
            height: 130px;

            object-fit: contain;
            pointer-events: none;
        }

        #previewWeapon {
            position: absolute;

            width: 64px;
            height: 64px;

            object-fit: contain;

            left: 50%;
            top: 50%;

            transform-origin: center center;

            pointer-events: none;
        }
    </style>
</head>

<body>

<a id="back" href="index.html"><-</a>

<div id="tabs">
    <div id="skinsTab" class="tab active">Skins</div>
    <div id="weaponsTab" class="tab">Weapons</div>
</div>

<div id="inventory"></div>


<div id="preview">
    <img id="previewCharacter" src="assets/skins/starter.png">
    <img id="previewWeapon" src="assets/weapons/pistol.png">
</div>


<script>
const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();

function fullscreen() {
    if (tg.requestFullscreen) {
        tg.requestFullscreen();
    }
}

setTimeout(() => fullscreen(), 500);

tg.onEvent("fullscreenFailed", (data) => {
    console.log("Fullscreen failed:", data);
});

tg.onEvent("fullscreenChanged", (data) => {
    console.log("Fullscreen:", data.isFullscreen);
});

if (tg.BackButton) {
    tg.BackButton.hide();
}

if (tg.SettingsButton) {
    tg.SettingsButton.hide();
}


// -------------------------
// Equipment
// -------------------------

const defaultSkin = "assets/skins/starter.png";
const defaultWeapon = "assets/weapons/pistol.png";

let selectedSkin =
    localStorage.getItem("selectedSkin") || defaultSkin;

let selectedWeapon =
    localStorage.getItem("selectedWeapon") || defaultWeapon;

const inventory = document.getElementById("inventory");

const previewCharacter =
    document.getElementById("previewCharacter");

const previewWeapon =
    document.getElementById("previewWeapon");


// -------------------------
// Items
// -------------------------

const data = {
    skins: {
        Common: [
            {
                name: "Starter",
                image: "assets/skins/starter.png"
            }
        ]
    },

    weapons: {
        Common: [
            {
                name: "Pistol",
                image: "assets/weapons/pistol.png"
            }
        ]
    }
};


// -------------------------
// Create item
// -------------------------

function createItem(type, item) {
    const element = document.createElement("div");

    element.className = "item";

    const image = document.createElement("img");
    image.src = item.image;

    const name = document.createElement("div");
    name.className = "itemName";
    name.textContent = item.name;

    element.appendChild(image);
    element.appendChild(name);

    const selected =
        type === "skins"
            ? selectedSkin === item.image
            : selectedWeapon === item.image;

    if (selected) {
        element.classList.add("selected");
    }

    element.onclick = () => {

        if (type === "skins") {
            selectedSkin = item.image;

            localStorage.setItem(
                "selectedSkin",
                selectedSkin
            );

        } else {
            selectedWeapon = item.image;

            localStorage.setItem(
                "selectedWeapon",
                selectedWeapon
            );
        }

        updatePreview();
        showCategory(type);
    };

    return element;
}


// -------------------------
// Show category
// -------------------------

function showCategory(type) {

    inventory.innerHTML = "";

    const rarities = data[type];

    for (const rarity in rarities) {

        const items = rarities[rarity];

        if (!items || items.length === 0) {
            continue;
        }

        const section = document.createElement("div");
        section.className = "rarity";

        const title = document.createElement("div");
        title.className = "rarityTitle";
        title.textContent = rarity;

        const itemContainer = document.createElement("div");
        itemContainer.className = "items";

        items.forEach(item => {
            itemContainer.appendChild(
                createItem(type, item)
            );
        });

        section.appendChild(title);
        section.appendChild(itemContainer);

        inventory.appendChild(section);
    }
}


// -------------------------
// Preview
// -------------------------

function updatePreview() {

    previewCharacter.src = selectedSkin;
    previewWeapon.src = selectedWeapon;
}


// -------------------------
// Preview aiming
// -------------------------

const preview = document.getElementById("preview");

function rotatePreview(x, y) {

    const rect = preview.getBoundingClientRect();

    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;

    const dx = x - centerX;
    const dy = y - centerY;

    const angle =
        Math.atan2(dy, dx) * 180 / Math.PI;

    preview.style.transform =
        `rotate(${angle}deg)`;

    previewWeapon.style.transform =
        "translate(-50%, -50%)";
}


// PC
document.addEventListener("mousemove", (event) => {
    rotatePreview(
        event.clientX,
        event.clientY
    );
});


// Phone
document.addEventListener("touchmove", (event) => {

    if (event.touches.length > 0) {

        const touch = event.touches[0];

        rotatePreview(
            touch.clientX,
            touch.clientY
        );
    }

}, { passive: true });


// -------------------------
// Tabs
// -------------------------

const skinsTab =
    document.getElementById("skinsTab");

const weaponsTab =
    document.getElementById("weaponsTab");

skinsTab.onclick = () => {

    skinsTab.classList.add("active");
    weaponsTab.classList.remove("active");

    showCategory("skins");
};

weaponsTab.onclick = () => {

    weaponsTab.classList.add("active");
    skinsTab.classList.remove("active");

    showCategory("weapons");
};


// -------------------------
// Start
// -------------------------

updatePreview();
showCategory("skins");
</script>

</body>
</html>
