<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>inventory</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
            color: white;
            font-family: Arial, sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;

            background-image: url("assets/ui/background.png");
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;

            display: flex;
        }

        /* BACK BUTTON */

        #back {
            position: fixed;
            top: 15px;
            left: 15px;

            width: 55px;
            height: 45px;

            background: #222;
            color: white;

            border: 2px solid white;
            border-radius: 8px;

            font-size: 24px;
            font-weight: bold;

            cursor: pointer;
            z-index: 10;
        }

        #back:active {
            background: white;
            color: black;
        }

        /* LEFT SIDE */

        #character-preview {
            width: 40%;
            height: 100%;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        /*
            This wrapper keeps the character exactly the same size.
            The weapon rotates around the character.
        */

        #preview-rig {
            position: relative;

            width: 256px;
            height: 256px;

            transform-origin: center center;
        }

        #character {
            position: absolute;

            left: 0;
            top: 0;

            width: 256px;
            height: 256px;

            object-fit: contain;
        }

        #weapon {
            position: absolute;

            width: 64px;
            height: 64px;

            left: 220px;
            top: 96px;

            object-fit: contain;

            pointer-events: none;
        }

        /* RIGHT SIDE */

        #inventory {
            width: 60%;
            height: 100%;

            padding: 25px;

            display: flex;
            flex-direction: column;
        }

        /* TABS */

        #tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .tab {
            flex: 1;

            padding: 15px;

            background: #222;
            color: white;

            border: 2px solid white;
            border-radius: 8px;

            font-size: 20px;
            font-weight: bold;

            cursor: pointer;
        }

        .tab.active {
            background: white;
            color: black;
        }

        /* ITEM LIST */

        #items {
            flex: 1;
            overflow-y: auto;
            padding-right: 8px;
        }

        .rarity {
            margin-bottom: 20px;
        }

        .rarity-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .divider {
            color: #aaa;
            margin-bottom: 10px;
            white-space: nowrap;
        }

        .items-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .item {
            width: 90px;
            height: 90px;

            background: #181818;
            border: 2px solid #555;
            border-radius: 8px;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;
        }

        .item:hover {
            border-color: white;
        }

        .item img {
            max-width: 80%;
            max-height: 80%;
            object-fit: contain;
        }

        /* MOBILE */

        @media (max-width: 700px) {

            #character-preview {
                width: 35%;
            }

            #inventory {
                width: 65%;
                padding: 15px;
            }

            #preview-rig {
                width: 180px;
                height: 180px;
            }

            #character {
                width: 180px;
                height: 180px;
            }

            #weapon {
                width: 64px;
                height: 64px;

                left: 150px;
                top: 58px;
            }

            .item {
                width: 65px;
                height: 65px;
            }

            .tab {
                padding: 10px;
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <!-- BACK -->
    <button id="back" onclick="goBack()"><-</button>

    <!-- CHARACTER PREVIEW -->
    <div id="character-preview">

        <div id="preview-rig">

            <img
                id="character"
                src="assets/skins/starter.png"
                alt="Starter"
            >

            <img
                id="weapon"
                src="assets/weapons/pistol.png"
                alt="Pistol"
            >

        </div>

    </div>

    <!-- INVENTORY -->
    <div id="inventory">

        <!-- TABS -->
        <div id="tabs">

            <button
                class="tab active"
                onclick="showCategory('skins')"
            >
                Skins
            </button>

            <button
                class="tab"
                onclick="showCategory('weapons')"
            >
                Weapons
            </button>

        </div>

        <!-- ITEMS -->
        <div id="items"></div>

    </div>

    <script>

        const tg = window.Telegram.WebApp;

        tg.ready();
        tg.expand();

        if (tg.BackButton) {
            tg.BackButton.hide();
        }

        if (tg.SettingsButton) {
            tg.SettingsButton.hide();
        }


        /* =========================
           INVENTORY
        ========================= */

        const rarities = [
            "Common",
            "Uncommon",
            "Rare",
            "Epic",
            "Mythic",
            "Legendary",
            "Ultra",
            "Special"
        ];


        function createItem(type, rarity) {

            /* STARTER SKIN */

            if (type === "skins" && rarity === "Common") {

                const item = document.createElement("div");

                item.className = "item";

                const img = document.createElement("img");

                img.src = "assets/skins/starter.png";
                img.alt = "Starter";

                item.appendChild(img);

                item.onclick = () => {

                    localStorage.setItem(
                        "selectedSkin",
                        "assets/skins/starter.png"
                    );

                    updatePreview();
                };

                return item;
            }


            /* PISTOL */

            if (type === "weapons" && rarity === "Common") {

                const item = document.createElement("div");

                item.className = "item";

                const img = document.createElement("img");

                img.src = "assets/weapons/pistol.png";
                img.alt = "Pistol";

                item.appendChild(img);

                item.onclick = () => {

                    localStorage.setItem(
                        "selectedWeapon",
                        "assets/weapons/pistol.png"
                    );

                    updatePreview();
                };

                return item;
            }


            return null;
        }


        function showCategory(category) {

            const container = document.getElementById("items");

            container.innerHTML = "";


            /* Active tab */

            document.querySelectorAll(".tab").forEach(button => {
                button.classList.remove("active");
            });


            if (category === "skins") {

                document
                    .querySelectorAll(".tab")[0]
                    .classList.add("active");

            } else {

                document
                    .querySelectorAll(".tab")[1]
                    .classList.add("active");

            }


            /* Rarities */

            rarities.forEach(rarity => {

                const item = createItem(category, rarity);

                if (!item) {
                    return;
                }


                const section = document.createElement("div");

                section.className = "rarity";


                const title = document.createElement("div");

                title.className = "rarity-title";
                title.textContent = rarity;


                const divider = document.createElement("div");

                divider.className = "divider";
                divider.textContent = "____________________________";


                const row = document.createElement("div");

                row.className = "items-row";


                row.appendChild(item);

                section.appendChild(title);
                section.appendChild(divider);
                section.appendChild(row);

                container.appendChild(section);

            });

        }


        /* =========================
           PREVIEW
        ========================= */

        function updatePreview() {

            const skin =
                localStorage.getItem("selectedSkin")
                || "assets/skins/starter.png";

            const weapon =
                localStorage.getItem("selectedWeapon")
                || "assets/weapons/pistol.png";


            document.getElementById("character").src = skin;

            document.getElementById("weapon").src = weapon;

        }


        /* =========================
           AIMING
        ========================= */

        const rig =
            document.getElementById("preview-rig");


        function aimAt(x, y) {

            const rect =
                rig.getBoundingClientRect();


            const centerX =
                rect.left + rect.width / 2;

            const centerY =
                rect.top + rect.height / 2;


            const dx =
                x - centerX;

            const dy =
                y - centerY;


            const angle =
                Math.atan2(dy, dx) * 180 / Math.PI;


            rig.style.transform =
                `rotate(${angle}deg)`;

        }


        /* PC */

        document.addEventListener("mousemove", event => {

            aimAt(
                event.clientX,
                event.clientY
            );

        });


        /* PHONE */

        document.addEventListener(
            "touchstart",
            event => {

                if (event.touches.length === 0) {
                    return;
                }

                const touch =
                    event.touches[0];

                aimAt(
                    touch.clientX,
                    touch.clientY
                );

            },
            { passive: true }
        );


        document.addEventListener(
            "touchmove",
            event => {

                if (event.touches.length === 0) {
                    return;
                }

                const touch =
                    event.touches[0];

                aimAt(
                    touch.clientX,
                    touch.clientY
                );

            },
            { passive: true }
        );


        /* =========================
           BACK
        ========================= */

        function goBack() {

            window.location.href =
                "index.html";

        }


        /* =========================
           START
        ========================= */

        updatePreview();

        showCategory("skins");


        /* =========================
           FULLSCREEN
        ========================= */

        function fullscreen() {

            if (tg.requestFullscreen) {

                tg.requestFullscreen();

            }

        }


        setTimeout(() => {

            fullscreen();

        }, 500);


        tg.onEvent(
            "fullscreenFailed",
            (data) => {

                console.log(
                    "Fullscreen failed:",
                    data
                );

            }
        );


        tg.onEvent(
            "fullscreenChanged",
            (data) => {

                console.log(
                    "Fullscreen:",
                    data.isFullscreen
                );

            }
        );

    </script>

</body>
</html>
