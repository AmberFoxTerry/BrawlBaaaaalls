<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Inventory - Brawl Baaaaalls</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
            color: white;
            font-family: Arial, sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            background-image: url("assets/ui/background.png");
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;

            display: flex;
        }

        /* LEFT SIDE */

        #character-preview {
            width: 40%;
            height: 100%;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        #character {
            width: 256px;
            height: 256px;
            object-fit: contain;
        }

        /* RIGHT SIDE */

        #inventory {
            width: 60%;
            height: 100%;

            padding: 25px;

            display: flex;
            flex-direction: column;
        }

        /* TABS */

        #tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .tab {
            flex: 1;

            padding: 15px;

            background: #222;
            color: white;

            border: 2px solid white;
            border-radius: 8px;

            font-size: 20px;
            font-weight: bold;

            cursor: pointer;
        }

        .tab.active {
            background: white;
            color: black;
        }

        /* ITEM LIST */

        #items {
            flex: 1;
            overflow-y: auto;
            padding-right: 8px;
        }

        .rarity {
            margin-bottom: 20px;
        }

        .rarity-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;

            white-space: nowrap;
            overflow: hidden;
        }

        .divider {
            color: #aaa;
            margin-bottom: 10px;
            white-space: nowrap;
        }

        .items-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .item {
            width: 90px;
            height: 90px;

            background: #181818;
            border: 2px solid #555;
            border-radius: 8px;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;
        }

        .item:hover {
            border-color: white;
        }

        .item img {
            max-width: 80%;
            max-height: 80%;
            object-fit: contain;
        }

        .item-name {
            font-size: 12px;
            text-align: center;
        }

        /* MOBILE */

        @media (max-width: 700px) {
            #character-preview {
                width: 35%;
            }

            #inventory {
                width: 65%;
                padding: 15px;
            }

            #character {
                width: 180px;
                height: 180px;
            }

            .item {
                width: 65px;
                height: 65px;
            }

            .tab {
                padding: 10px;
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <!-- CHARACTER -->
    <div id="character-preview">
        <img
            id="character"
            src="assets/ui/character.png"
            alt="Character"
        >
    </div>

    <!-- INVENTORY -->
    <div id="inventory">

        <!-- TABS -->
        <div id="tabs">
            <button class="tab active" onclick="showCategory('skins')">
                Skins
            </button>

            <button class="tab" onclick="showCategory('weapons')">
                Weapons
            </button>
        </div>

        <!-- ITEMS -->
        <div id="items"></div>

    </div>


    <script>
        const tg = window.Telegram.WebApp;

        tg.ready();
        tg.expand();

        if (tg.BackButton) {
            tg.BackButton.hide();
        }

        if (tg.SettingsButton) {
            tg.SettingsButton.hide();
        }


        const rarities = [
            "Common",
            "Uncommon",
            "Rare",
            "Epic",
            "Mythic",
            "Legendary",
            "Ultra",
            "Special"
        ];


        function createItem(type, rarity) {
            const item = document.createElement("div");
            item.className = "item";

            const name = document.createElement("div");
            name.className = "item-name";

            name.textContent = type === "skins"
                ? "Skin"
                : "Weapon";

            item.appendChild(name);

            return item;
        }


        function showCategory(category) {

            const container = document.getElementById("items");

            container.innerHTML = "";


            // Change active button
            document.querySelectorAll(".tab").forEach(button => {
                button.classList.remove("active");
            });

            if (category === "skins") {
                document.querySelectorAll(".tab")[0].classList.add("active");
            } else {
                document.querySelectorAll(".tab")[1].classList.add("active");
            }


            // Create rarities
            rarities.forEach(rarity => {

                const section = document.createElement("div");
                section.className = "rarity";


                const title = document.createElement("div");
                title.className = "rarity-title";
                title.textContent = rarity;


                const divider = document.createElement("div");
                divider.className = "divider";
                divider.textContent = "____________________________";


                const row = document.createElement("div");
                row.className = "items-row";


                // Placeholder items for now
                row.appendChild(createItem(category, rarity));
                row.appendChild(createItem(category, rarity));
                row.appendChild(createItem(category, rarity));


                section.appendChild(title);
                section.appendChild(divider);
                section.appendChild(row);

                container.appendChild(section);
            });
        }


        // Start with skins
        showCategory("skins");


        // Fullscreen
        function fullscreen() {
            if (tg.requestFullscreen) {
                tg.requestFullscreen();
            }
        }

        setTimeout(() => {
            fullscreen();
        }, 500);

        tg.onEvent("fullscreenFailed", (data) => {
            console.log("Fullscreen failed:", data);
        });

        tg.onEvent("fullscreenChanged", (data) => {
            console.log("Fullscreen:", data.isFullscreen);
        });
    </script>

</body>
</html>
