<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>inventory</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

body {
    background: url("assets/ui/background.png") center / cover no-repeat;

    color: white;
    font-family: Arial, sans-serif;
}


/* Back */

#back {
    position: absolute;

    top: 20px;
    left: 20px;

    color: white;
    text-decoration: none;

    font-size: 32px;

    z-index: 50;
}


/* Tabs */

#tabs {
    position: absolute;

    top: 20px;
    left: 50%;

    transform: translateX(-50%);

    display: flex;
    gap: 40px;

    font-size: 24px;
    font-weight: bold;

    z-index: 50;
}

.tab {
    cursor: pointer;
    opacity: 0.5;
}

.tab.active {
    opacity: 1;
}


/* Inventory */

#inventory {
    position: absolute;

    top: 90px;
    left: 30px;

    width: calc(100% - 60px);
    height: calc(100% - 120px);

    overflow-y: auto;

    padding: 20px;
}


/* Rarity */

.rarity {
    margin-bottom: 30px;
}

.rarityTitle {
    font-size: 22px;
    font-weight: bold;

    margin-bottom: 20px;
}


/* Items */

.items {
    display: flex;
    flex-wrap: wrap;

    gap: 30px;
}

.item {
    width: 100px;

    display: flex;
    flex-direction: column;
    align-items: center;

    cursor: pointer;

    text-align: center;
}


/* Image */

.itemImage {
    width: 80px;
    height: 80px;

    object-fit: contain;

    display: block;
}


/* NAME — always directly underneath */

.itemName {
    display: block;

    width: 100%;

    margin-top: 10px;

    color: white;

    font-size: 16px;
    font-weight: bold;

    text-align: center;
}


/* Selected */

.item.selected .itemImage {
    outline: 2px solid white;
    outline-offset: 5px;
}


/* ------------------------- */
/* Preview                   */
/* ------------------------- */

#preview {
    position: absolute;

    right: 40px;
    bottom: 40px;

    width: 220px;
    height: 220px;

    transform-origin: center center;

    pointer-events: none;
}


/* Player */

#previewCharacter {
    position: absolute;

    width: 120px;
    height: 120px;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    object-fit: contain;
}


/* Weapon outside player */

#previewWeapon {
    position: absolute;

    width: 64px;
    height: 64px;

    left: calc(50% + 65px);
    top: 50%;

    transform: translateY(-50%);

    object-fit: contain;
}
</style>
</head>

<body>

<a id="back" href="index.html"><-</a>


<div id="tabs">

    <div id="skinsTab" class="tab active">
        Skins
    </div>

    <div id="weaponsTab" class="tab">
        Weapons
    </div>

</div>


<div id="inventory"></div>


<!-- Equipped player preview -->

<div id="preview">

    <img id="previewCharacter"
         src="assets/skins/starter.png">

    <img id="previewWeapon"
         src="assets/weapons/pistol.png">

</div>


<script>
const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();

if (tg.requestFullscreen) {
    setTimeout(() => tg.requestFullscreen(), 500);
}

if (tg.BackButton) {
    tg.BackButton.hide();
}

if (tg.SettingsButton) {
    tg.SettingsButton.hide();
}


// -------------------------
// Selected equipment
// -------------------------

let selectedSkin =
    localStorage.getItem("selectedSkin")
    || "assets/skins/starter.png";

let selectedWeapon =
    localStorage.getItem("selectedWeapon")
    || "assets/weapons/pistol.png";


// -------------------------
// Inventory
// -------------------------

const inventoryData = {

    skins: {
        Common: [
            {
                name: "Starter",
                image: "assets/skins/starter.png"
            }
        ]
    },

    weapons: {
        Common: [
            {
                name: "Pistol",
                image: "assets/weapons/pistol.png"
            }
        ]
    }
};


// -------------------------
// Elements
// -------------------------

const inventory =
    document.getElementById("inventory");

const preview =
    document.getElementById("preview");

const previewCharacter =
    document.getElementById("previewCharacter");

const previewWeapon =
    document.getElementById("previewWeapon");


// -------------------------
// Create item
// -------------------------

function createItem(type, item) {

    const element =
        document.createElement("div");

    element.className = "item";


    // Image
    const image =
        document.createElement("img");

    image.className = "itemImage";
    image.src = item.image;
    image.alt = item.name;


    // Name
    const name =
        document.createElement("div");

    name.className = "itemName";
    name.textContent = item.name;


    // Put image AND name inside item
    element.appendChild(image);
    element.appendChild(name);


    // Selected state
    if (
        (type === "skins" &&
         selectedSkin === item.image)
        ||
        (type === "weapons" &&
         selectedWeapon === item.image)
    ) {
        element.classList.add("selected");
    }


    // Select item
    element.onclick = () => {

        if (type === "skins") {

            selectedSkin = item.image;

            localStorage.setItem(
                "selectedSkin",
                selectedSkin
            );

        }

        if (type === "weapons") {

            selectedWeapon = item.image;

            localStorage.setItem(
                "selectedWeapon",
                selectedWeapon
            );
        }


        updatePreview();

        showCategory(type);
    };


    return element;
}


// -------------------------
// Show inventory category
// -------------------------

function showCategory(type) {

    inventory.innerHTML = "";

    const categories =
        inventoryData[type];


    for (const rarity in categories) {

        const items =
            categories[rarity];


        const raritySection =
            document.createElement("div");

        raritySection.className = "rarity";


        const rarityTitle =
            document.createElement("div");

        rarityTitle.className = "rarityTitle";
        rarityTitle.textContent = rarity;


        const itemContainer =
            document.createElement("div");

        itemContainer.className = "items";


        for (const item of items) {

            itemContainer.appendChild(
                createItem(type, item)
            );
        }


        raritySection.appendChild(
            rarityTitle
        );

        raritySection.appendChild(
            itemContainer
        );

        inventory.appendChild(
            raritySection
        );
    }
}


// -------------------------
// Preview
// -------------------------

function updatePreview() {

    previewCharacter.src =
        selectedSkin;

    previewWeapon.src =
        selectedWeapon;
}


// -------------------------
// Aim preview
// -------------------------

function aimPreview(x, y) {

    const rect =
        preview.getBoundingClientRect();

    const centerX =
        rect.left + rect.width / 2;

    const centerY =
        rect.top + rect.height / 2;


    const dx = x - centerX;
    const dy = y - centerY;


    const angle =
        Math.atan2(dy, dx) * 180 / Math.PI;


    preview.style.transform =
        `rotate(${angle}deg)`;
}


// PC
document.addEventListener("mousemove", e => {

    aimPreview(
        e.clientX,
        e.clientY
    );

});


// Phone
document.addEventListener("touchstart", e => {

    if (e.touches.length > 0) {

        const touch = e.touches[0];

        aimPreview(
            touch.clientX,
            touch.clientY
        );
    }

}, { passive: true });


document.addEventListener("touchmove", e => {

    if (e.touches.length > 0) {

        const touch = e.touches[0];

        aimPreview(
            touch.clientX,
            touch.clientY
        );
    }

}, { passive: true });


// -------------------------
// Tabs
// -------------------------

const skinsTab =
    document.getElementById("skinsTab");

const weaponsTab =
    document.getElementById("weaponsTab");


skinsTab.onclick = () => {

    skinsTab.classList.add("active");
    weaponsTab.classList.remove("active");

    showCategory("skins");
};


weaponsTab.onclick = () => {

    weaponsTab.classList.add("active");
    skinsTab.classList.remove("active");

    showCategory("weapons");
};


// -------------------------
// Start
// -------------------------

updatePreview();

showCategory("skins");
</script>

</body>
</html>
