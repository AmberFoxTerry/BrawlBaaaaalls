<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>inventory</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        body {
            background-image: url("assets/ui/background.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            color: white;
            font-family: Arial, sans-serif;
        }


        /* Back button */

        #back {
            position: absolute;
            top: 20px;
            left: 20px;

            color: white;
            text-decoration: none;

            font-size: 32px;

            z-index: 20;
        }


        /* Tabs */

        #tabs {
            position: absolute;

            top: 20px;
            left: 50%;

            transform: translateX(-50%);

            display: flex;
            gap: 30px;

            font-size: 24px;
            font-weight: bold;

            z-index: 10;
        }

        .tab {
            cursor: pointer;
            opacity: 0.5;
        }

        .tab.active {
            opacity: 1;
        }


        /* Inventory */

        #inventory {
            position: absolute;

            top: 85px;
            left: 30px;
            right: 30px;
            bottom: 30px;

            overflow-y: auto;
            overflow-x: hidden;

            padding: 20px;
        }


        /* Rarity */

        .rarity {
            margin-bottom: 30px;
        }

        .rarityTitle {
            font-size: 22px;
            font-weight: bold;

            margin-bottom: 15px;
        }


        /* Items */

        .items {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
        }

        .item {
            width: 100px;

            text-align: center;

            cursor: pointer;
        }

        .itemImage {
            width: 80px;
            height: 80px;

            object-fit: contain;

            display: block;

            margin: 0 auto;
        }

        .itemName {
            margin-top: 8px;

            width: 100%;

            font-size: 16px;
            font-weight: bold;

            text-align: center;
        }

        .selected .itemImage {
            outline: 2px solid white;
            outline-offset: 5px;
        }


        /* Player preview */

        #preview {
            position: absolute;

            right: 35px;
            bottom: 35px;

            width: 220px;
            height: 220px;

            transform-origin: center center;

            pointer-events: none;
        }

        #previewCharacter {
            position: absolute;

            width: 120px;
            height: 120px;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            object-fit: contain;
        }

        /* Weapon outside player */

        #previewWeapon {
            position: absolute;

            width: 64px;
            height: 64px;

            left: calc(50% + 65px);
            top: 50%;

            transform: translateY(-50%);

            object-fit: contain;
        }
    </style>
</head>

<body>

<a id="back" href="index.html"><-</a>

<div id="tabs">
    <div id="skinsTab" class="tab active">Skins</div>
    <div id="weaponsTab" class="tab">Weapons</div>
</div>

<div id="inventory"></div>


<!-- Player + weapon preview -->

<div id="preview">
    <img id="previewCharacter"
         src="assets/skins/starter.png">

    <img id="previewWeapon"
         src="assets/weapons/pistol.png">
</div>


<script>
const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();

function fullscreen() {
    if (tg.requestFullscreen) {
        tg.requestFullscreen();
    }
}

setTimeout(fullscreen, 500);

if (tg.BackButton) {
    tg.BackButton.hide();
}

if (tg.SettingsButton) {
    tg.SettingsButton.hide();
}


// -------------------------
// Equipment
// -------------------------

let selectedSkin =
    localStorage.getItem("selectedSkin") ||
    "assets/skins/starter.png";

let selectedWeapon =
    localStorage.getItem("selectedWeapon") ||
    "assets/weapons/pistol.png";


// -------------------------
// Inventory data
// -------------------------

const data = {

    skins: {
        Common: [
            {
                name: "Starter",
                image: "assets/skins/starter.png"
            }
        ]
    },

    weapons: {
        Common: [
            {
                name: "Pistol",
                image: "assets/weapons/pistol.png"
            }
        ]
    }
};


// -------------------------
// Elements
// -------------------------

const inventory =
    document.getElementById("inventory");

const preview =
    document.getElementById("preview");

const previewCharacter =
    document.getElementById("previewCharacter");

const previewWeapon =
    document.getElementById("previewWeapon");


// -------------------------
// Create inventory item
// -------------------------

function createItem(type, item) {

    const element =
        document.createElement("div");

    element.className = "item";


    const image =
        document.createElement("img");

    image.className = "itemImage";
    image.src = item.image;


    const name =
        document.createElement("div");

    name.className = "itemName";
    name.textContent = item.name;


    element.appendChild(image);
    element.appendChild(name);


    const isSelected =
        type === "skins"
            ? selectedSkin === item.image
            : selectedWeapon === item.image;


    if (isSelected) {
        element.classList.add("selected");
    }


    element.onclick = () => {

        if (type === "skins") {

            selectedSkin = item.image;

            localStorage.setItem(
                "selectedSkin",
                selectedSkin
            );

        } else {

            selectedWeapon = item.image;

            localStorage.setItem(
                "selectedWeapon",
                selectedWeapon
            );
        }


        updatePreview();

        showCategory(type);
    };


    return element;
}


// -------------------------
// Display category
// -------------------------

function showCategory(type) {

    inventory.innerHTML = "";

    const rarities = data[type];


    for (const rarity in rarities) {

        const items = rarities[rarity];

        if (!items || items.length === 0) {
            continue;
        }


        const section =
            document.createElement("div");

        section.className = "rarity";


        const title =
            document.createElement("div");

        title.className = "rarityTitle";
        title.textContent = rarity;


        const itemContainer =
            document.createElement("div");

        itemContainer.className = "items";


        items.forEach(item => {

            itemContainer.appendChild(
                createItem(type, item)
            );

        });


        section.appendChild(title);
        section.appendChild(itemContainer);

        inventory.appendChild(section);
    }
}


// -------------------------
// Update preview
// -------------------------

function updatePreview() {

    previewCharacter.src =
        selectedSkin;

    previewWeapon.src =
        selectedWeapon;
}


// -------------------------
// Aim preview
// -------------------------

function aimPreview(x, y) {

    const rect =
        preview.getBoundingClientRect();

    const centerX =
        rect.left + rect.width / 2;

    const centerY =
        rect.top + rect.height / 2;


    const dx = x - centerX;
    const dy = y - centerY;


    const angle =
        Math.atan2(dy, dx) * 180 / Math.PI;


    preview.style.transform =
        `rotate(${angle}deg)`;
}


// PC
document.addEventListener("mousemove", event => {

    aimPreview(
        event.clientX,
        event.clientY
    );

});


// Phone
document.addEventListener("touchstart", event => {

    if (event.touches.length > 0) {

        const touch =
            event.touches[0];

        aimPreview(
            touch.clientX,
            touch.clientY
        );
    }

}, { passive: true });


document.addEventListener("touchmove", event => {

    if (event.touches.length > 0) {

        const touch =
            event.touches[0];

        aimPreview(
            touch.clientX,
            touch.clientY
        );
    }

}, { passive: true });


// -------------------------
// Tabs
// -------------------------

const skinsTab =
    document.getElementById("skinsTab");

const weaponsTab =
    document.getElementById("weaponsTab");


skinsTab.onclick = () => {

    skinsTab.classList.add("active");
    weaponsTab.classList.remove("active");

    showCategory("skins");
};


weaponsTab.onclick = () => {

    weaponsTab.classList.add("active");
    skinsTab.classList.remove("active");

    showCategory("weapons");
};


// -------------------------
// Start
// -------------------------

updatePreview();

showCategory("skins");
</script>

</body>
</html>
