<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Brawl Baaaaalls</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

body {
    background: url("assets/ui/background.png") center / cover no-repeat;

    display: flex;
    justify-content: center;
    align-items: center;
}

/* =========================
   PLAYER
========================= */

#playerLink {
    text-decoration: none;
}

#player {
    position: relative;

    width: 220px;
    height: 220px;

    transform-origin: center;
}

/* Player stays in the center */

#character {
    position: absolute;

    width: 120px;
    height: 120px;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    object-fit: contain;

    pointer-events: none;
}

/* Pistol is OUTSIDE the player */

#weapon {
    position: absolute;

    width: 64px;
    height: 64px;

    left: calc(50% + 65px);
    top: 50%;

    transform: translateY(-50%);

    object-fit: contain;

    pointer-events: none;
}


/* =========================
   EVENTS
========================= */

#events {
    position: fixed;

    bottom: 25px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 20;
}

.event-button {
    background: #222;
    color: white;

    border: 2px solid white;
    border-radius: 8px;

    padding: 12px 20px;

    font-size: 18px;
    font-weight: bold;

    cursor: pointer;

    white-space: nowrap;
}

.event-button:active {
    background: white;
    color: black;
}


/* =========================
   PLAY BUTTON
========================= */

#play {
    position: fixed;

    right: 25px;
    bottom: 25px;

    z-index: 20;

    width: 140px;
    height: 60px;

    background: #222;
    color: white;

    border: 2px solid white;
    border-radius: 8px;

    font-size: 24px;
    font-weight: bold;

    cursor: pointer;
}

#play:active {
    background: white;
    color: black;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    #events {
        bottom: 20px;
    }

    .event-button {
        font-size: 14px;
        padding: 10px 14px;
    }

    #play {
        right: 15px;
        bottom: 20px;

        width: 100px;
        height: 50px;

        font-size: 20px;
    }
}
</style>
</head>

<body>


<!-- =========================
     PLAYER
========================= -->

<a id="playerLink" href="inventory.html">

    <div id="player">

        <img
            id="character"
            src="assets/skins/starter.png"
        >

        <img
            id="weapon"
            src="assets/weapons/pistol.png"
        >

    </div>

</a>


<!-- =========================
     EVENTS
========================= -->

<div id="events">

    <button
        class="event-button"
        onclick="multiplayerTest()"
    >
        1v1 - Multiplayer test
    </button>

</div>


<!-- =========================
     PLAY
========================= -->

<button
    id="play"
    onclick="playGame()"
>
    Play
</button>


<script>

const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();

if (tg.requestFullscreen) {
    setTimeout(() => tg.requestFullscreen(), 500);
}

if (tg.BackButton) {
    tg.BackButton.hide();
}

if (tg.SettingsButton) {
    tg.SettingsButton.hide();
}


/* =========================
   LOAD EQUIPMENT
========================= */

const skin =
    localStorage.getItem("selectedSkin")
    || "assets/skins/starter.png";

const weapon =
    localStorage.getItem("selectedWeapon")
    || "assets/weapons/pistol.png";

document.getElementById("character").src = skin;
document.getElementById("weapon").src = weapon;


/* =========================
   AIM
========================= */

const player =
    document.getElementById("player");


function aimAt(x, y) {

    const rect =
        player.getBoundingClientRect();

    const centerX =
        rect.left + rect.width / 2;

    const centerY =
        rect.top + rect.height / 2;

    const dx =
        x - centerX;

    const dy =
        y - centerY;

    const angle =
        Math.atan2(dy, dx) * 180 / Math.PI;

    player.style.transform =
        `rotate(${angle}deg)`;
}


/* PC */

document.addEventListener("mousemove", e => {

    aimAt(
        e.clientX,
        e.clientY
    );

});


/* PHONE */

document.addEventListener("touchstart", e => {

    if (e.touches.length > 0) {

        const touch =
            e.touches[0];

        aimAt(
            touch.clientX,
            touch.clientY
        );

    }

}, { passive: true });


document.addEventListener("touchmove", e => {

    if (e.touches.length > 0) {

        const touch =
            e.touches[0];

        aimAt(
            touch.clientX,
            touch.clientY
        );

    }

}, { passive: true });


/* =========================
   BUTTONS
========================= */

function multiplayerTest() {

    // Nothing yet :3

}


function playGame() {

    // Nothing yet :3

}

</script>

</body>
</html>
