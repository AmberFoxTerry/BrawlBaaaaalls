<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Brawl Baaaaalls</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;

            font-family: Arial, sans-serif;
        }

        body {
            background: #2196f3;
        }


        /* ROTATE SCREEN */

        #rotateScreen {
            position: fixed;

            inset: 0;

            background: #2196f3;

            color: white;

            display: none;

            align-items: center;
            justify-content: center;

            flex-direction: column;

            text-align: center;

            z-index: 9999;
        }

        #rotateScreen h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        #rotateScreen p {
            font-size: 18px;
        }


        /* GAME */

        #game {
            width: 100%;
            height: 100%;

            position: relative;
        }


        /* PLAYER */

        .player {
            position: absolute;

            top: 15px;
            left: 15px;

            display: flex;

            align-items: center;

            gap: 10px;

            color: white;

            font-size: 18px;
            font-weight: bold;
        }

        .pfp {
            width: 50px;
            height: 50px;

            border-radius: 50%;

            object-fit: cover;

            background: white;
        }


        /* BALL */

        .ball {
            position: absolute;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            width: 110px;
            height: 110px;

            background: white;

            border-radius: 50%;

            box-shadow:
                0 8px 15px rgba(0, 0, 0, 0.2);
        }


        /* START */

        .start-button {
            position: absolute;

            right: 25px;
            bottom: 25px;

            width: 170px;
            height: 65px;

            border: none;

            border-radius: 16px;

            background: #ffd21f;

            font-size: 26px;
            font-weight: bold;

            box-shadow:
                0 6px 0 #c9a500;
        }

        .start-button:active {
            transform: translateY(5px);

            box-shadow:
                0 1px 0 #c9a500;
        }


        /* DESKTOP BLOCK */

        @media (min-width: 700px) {
            body {
                background: #111;
            }

            #game {
                display: none;
            }

            #rotateScreen {
                display: flex;
            }
        }


        /* PHONE PORTRAIT */

        @media (max-width: 699px) and (orientation: portrait) {

            #game {
                display: none;
            }

            #rotateScreen {
                display: flex;
            }
        }

    </style>
</head>


<body>


    <!-- ROTATION / DESKTOP MESSAGE -->

    <div id="rotateScreen">

        <h1>↻</h1>

        <h1>Rotate your phone</h1>

        <p>Brawl Baaaaalls is landscape only!</p>

    </div>


    <!-- GAME -->

    <div id="game">


        <!-- PLAYER -->

        <div class="player">

            <img
                id="pfp"
                class="pfp"
                alt="Profile picture"
            >

            <span id="playerName">
                Loading...
            </span>

        </div>


        <!-- BALL -->

        <div class="ball"></div>


        <!-- START -->

        <button
            class="start-button"
            onclick="startGame()"
        >
            START
        </button>


    </div>


    <script>

        const tg = window.Telegram.WebApp;


        // Telegram

        tg.ready();

        tg.expand();


        // Try fullscreen

        if (tg.requestFullscreen) {
            tg.requestFullscreen();
        }


        // Try landscape

        if (tg.lockOrientation) {
            tg.lockOrientation("landscape");
        }


        // Telegram user

        const user = tg.initDataUnsafe?.user;


        if (user) {

            let name = user.first_name || "Player";

            if (user.last_name) {
                name += " " + user.last_name;
            }

            document.getElementById(
                "playerName"
            ).textContent = name;


            if (user.photo_url) {

                document.getElementById(
                    "pfp"
                ).src = user.photo_url;

            }

        } else {

            document.getElementById(
                "playerName"
            ).textContent = "Player";

        }


        function startGame() {

            console.log("BRAWL BAAAAALLS!");

        }

    </script>

</body>
</html>
