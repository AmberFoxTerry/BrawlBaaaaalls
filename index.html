<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Brawl Baaaaalls</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        body {
            width: 100vw;
            height: 100vh;

            background-image: url("assets/ui/background.png");
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
        }

        #character {
            position: absolute;

            left: 50%;
            top: 50%;

            width: 150px;
            height: 150px;

            transform: translate(-50%, -50%);

            object-fit: contain;

            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
        }

        #fullscreen {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            background: transparent;
            border: none;

            pointer-events: none;
        }
    </style>
</head>

<body>

    <!-- SELECTED SKIN -->
    <a href="inventory.html">
        <img
            id="character"
            src="assets/skins/starter.png"
            alt="Selected Skin"
        >
    </a>

    <button id="fullscreen"></button>

    <script>
        const tg = window.Telegram.WebApp;

        tg.ready();
        tg.expand();

        if (tg.BackButton) {
            tg.BackButton.hide();
        }

        if (tg.SettingsButton) {
            tg.SettingsButton.hide();
        }

        // Load selected skin
        const selectedSkin = localStorage.getItem("selectedSkin");

        if (selectedSkin) {
            document.getElementById("character").src = selectedSkin;
        }

        // Fullscreen
        function fullscreen() {
            if (tg.requestFullscreen) {
                tg.requestFullscreen();
            }
        }

        setTimeout(() => {
            fullscreen();
        }, 500);

        tg.onEvent("fullscreenFailed", (data) => {
            console.log("Fullscreen failed:", data);
        });

        tg.onEvent("fullscreenChanged", (data) => {
            console.log("Fullscreen:", data.isFullscreen);
        });
    </script>

</body>
</html>
