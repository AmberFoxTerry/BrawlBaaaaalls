<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Menu</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        body {
            background-image: url("assets/ui/background.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        #playerLink {
            text-decoration: none;
        }

        /* Whole player + weapon rig */
        #playerRig {
            position: relative;
            width: 220px;
            height: 220px;

            transform-origin: center center;

            cursor: pointer;
        }

        /* Player */
        #character {
            position: absolute;

            width: 120px;
            height: 120px;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            object-fit: contain;
            pointer-events: none;
        }

        /* Weapon orbits OUTSIDE the player */
        #weapon {
            position: absolute;

            width: 64px;
            height: 64px;

            left: calc(50% + 65px);
            top: 50%;

            transform: translateY(-50%);

            object-fit: contain;
            pointer-events: none;
        }
    </style>
</head>

<body>

<a id="playerLink" href="inventory.html">
    <div id="playerRig">
        <img id="character" src="assets/skins/starter.png">
        <img id="weapon" src="assets/weapons/pistol.png">
    </div>
</a>

<script>
const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();

function fullscreen() {
    if (tg.requestFullscreen) {
        tg.requestFullscreen();
    }
}

setTimeout(fullscreen, 500);

if (tg.BackButton) {
    tg.BackButton.hide();
}

if (tg.SettingsButton) {
    tg.SettingsButton.hide();
}


// -------------------------
// Equipment
// -------------------------

const selectedSkin =
    localStorage.getItem("selectedSkin") ||
    "assets/skins/starter.png";

const selectedWeapon =
    localStorage.getItem("selectedWeapon") ||
    "assets/weapons/pistol.png";

document.getElementById("character").src = selectedSkin;
document.getElementById("weapon").src = selectedWeapon;


// -------------------------
// Aim
// -------------------------

const playerRig = document.getElementById("playerRig");

function aimAt(x, y) {

    const rect = playerRig.getBoundingClientRect();

    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;

    const dx = x - centerX;
    const dy = y - centerY;

    const angle = Math.atan2(dy, dx) * 180 / Math.PI;

    playerRig.style.transform = `rotate(${angle}deg)`;
}


// PC
document.addEventListener("mousemove", event => {
    aimAt(event.clientX, event.clientY);
});


// Phone
document.addEventListener("touchstart", event => {

    if (event.touches.length > 0) {

        const touch = event.touches[0];

        aimAt(
            touch.clientX,
            touch.clientY
        );
    }

}, { passive: true });


document.addEventListener("touchmove", event => {

    if (event.touches.length > 0) {

        const touch = event.touches[0];

        aimAt(
            touch.clientX,
            touch.clientY
        );
    }

}, { passive: true });
</script>

</body>
</html>
