<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Brawl Baaaaalls</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: black;
        }

        body {
            width: 100vw;
            height: 100vh;
            background-image: url("assets/ui/background.png");
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
        }

        #fullscreen {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
        }
    </style>
</head>

<body>

<button id="fullscreen"></button>

<script>
const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();

// Hide Telegram buttons
if (tg.BackButton) {
    tg.BackButton.hide();
}

if (tg.SettingsButton) {
    tg.SettingsButton.hide();
}

function fullscreen() {
    if (tg.requestFullscreen) {
        tg.requestFullscreen();
    }
}

document.getElementById("fullscreen").addEventListener("click", fullscreen);

tg.onEvent("fullscreenFailed", (data) => {
    console.log("Fullscreen failed:", data);
});

tg.onEvent("fullscreenChanged", (data) => {
    console.log("Fullscreen:", data.isFullscreen);
});

setTimeout(() => {
    fullscreen();
}, 500);
</script>

</body>
</html>
