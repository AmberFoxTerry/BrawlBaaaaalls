<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="
        width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no
    "
>

<title>Brawl Baaaaalls</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;

    user-select: none;
    -webkit-user-select: none;
}

html,
body {

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;

    font-family: Arial, sans-serif;
}


/* =========================
   MENU
========================= */

#menu {

    position: fixed;

    inset: 0;

    background: #2196f3;
}


/* =========================
   PLAYER INFO
========================= */

.player-info {

    position: absolute;

    top: 15px;
    left: 15px;

    display: flex;

    align-items: center;

    gap: 10px;

    color: white;

    font-size: 18px;

    font-weight: bold;
}

.pfp {

    width: 50px;
    height: 50px;

    border-radius: 50%;

    object-fit: cover;

    background: white;
}


/* =========================
   BC
========================= */

#coins {

    position: absolute;

    top: 20px;
    right: 20px;

    padding: 10px 16px;

    border-radius: 15px;

    background:
        rgba(0,0,0,0.25);

    color: #ffd83d;

    font-size: 22px;

    font-weight: bold;
}


/* =========================
   CENTER BALL
========================= */

.menu-ball {

    position: absolute;

    width: 110px;
    height: 110px;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background: white;

    box-shadow:
        0 8px 20px
        rgba(0,0,0,0.25);

    cursor: pointer;
}


/* =========================
   BALL SELECTOR
========================= */

#ballSelector {

    position: absolute;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, 80px);

    display: none;

    gap: 12px;

    background:
        rgba(0,0,0,0.35);

    padding: 12px;

    border-radius: 18px;
}

.ball-option {

    width: 65px;
    height: 65px;

    border-radius: 50%;

    border: 3px solid
        rgba(255,255,255,0.4);

    background: white;
}

.ball-option.selected {

    border-color: white;

    transform: scale(1.1);
}


/* =========================
   BOWLING VISUAL
========================= */

.bowling-option {

    background: #7d1717;

    position: relative;
}

.bowling-option::before {

    content: "";

    position: absolute;

    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: #111;

    top: 18px;
    left: 18px;

    box-shadow:
        15px 4px 0 #111,
        8px 18px 0 #111;
}


/* =========================
   PINGPONG VISUAL
========================= */

.pingpong-option {

    background: #fff3a8;

    width: 50px;
    height: 50px;

    margin: 7px;
}


/* =========================
   SHOP
========================= */

#shop {

    position: absolute;

    left: 20px;
    bottom: 20px;

    width: 260px;

    padding: 14px;

    border-radius: 18px;

    background:
        rgba(0,0,0,0.30);

    color: white;
}

#shop h2 {

    margin-bottom: 10px;

    font-size: 20px;
}

.shop-item {

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 10px;

    padding: 8px;

    margin-top: 6px;

    border-radius: 12px;

    background:
        rgba(255,255,255,0.12);
}

.shop-item button {

    border: none;

    border-radius: 9px;

    padding: 8px 10px;

    background: #ffd21f;

    font-weight: bold;
}

.shop-item button:disabled {

    opacity: 0.4;
}


/* =========================
   PLAY
========================= */

.start {

    position: absolute;

    right: 30px;
    bottom: 30px;

    width: 180px;
    height: 70px;

    border: none;

    border-radius: 18px;

    background: #ffd21f;

    color: #222;

    font-size: 28px;

    font-weight: bold;
}


/* =========================
   MATCHING
========================= */

#matching {

    position: fixed;

    inset: 0;

    display: none;

    align-items: center;

    justify-content: center;

    flex-direction: column;

    background: #000;

    color: white;
}

#matching h1 {

    font-size: 40px;

    margin-bottom: 15px;
}

#matching p {

    font-size: 26px;
}


/* =========================
   ARENA
========================= */

#arena {

    position: fixed;

    inset: 0;

    display: none;

    background: #000;

    overflow: hidden;

    touch-action: none;
}

#camera {

    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    pointer-events: none;
}


/* =========================
   PLATFORM
========================= */

#platform {

    position: absolute;

    width: 600px;
    height: 600px;

    left: 50%;
    top: 50%;

    border-radius: 50%;

    background: #666;

    box-shadow:
        0 0 0 8px #444;

    transform:
        translate(-50%, -50%);
}


/* =========================
   BALL
========================= */

.ball {

    position: absolute;

    border-radius: 50%;

    transform:
        translate(-50%, -50%);

    z-index: 10;

    pointer-events: none;

    background: white;
}


/* Normal */

.ball.normal {

    width: 70px;
    height: 70px;

    background: white;
}


/* Bowling */

.ball.bowling {

    width: 90px;
    height: 90px;

    background: #7d1717;
}


/* Bowling holes */

.ball.bowling::before {

    content: "";

    position: absolute;

    width: 10px;
    height: 10px;

    border-radius: 50%;

    background: #111;

    top: 25px;
    left: 25px;

    box-shadow:
        20px 5px 0 #111,
        10px 22px 0 #111;
}


/* Ping pong */

.ball.pingpong {

    width: 50px;
    height: 50px;

    background: #fff3a8;
}


/* =========================
   NAME
========================= */

.ball-name {

    position: absolute;

    left: 50%;

    bottom: calc(100% + 8px);

    transform:
        translateX(-50%);

    color: white;

    font-size: 15px;

    font-weight: bold;

    white-space: nowrap;

    text-shadow:
        0 2px 4px #000;
}


/* =========================
   JOYSTICK
========================= */

#joystick {

    position: fixed;

    left: 35px;
    bottom: 35px;

    width: 130px;
    height: 130px;

    border-radius: 50%;

    background:
        rgba(255,255,255,0.15);

    border:
        3px solid
        rgba(255,255,255,0.3);

    z-index: 50;

    touch-action: none;
}

#stick {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 60px;
    height: 60px;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background:
        rgba(255,255,255,0.6);
}


/* =========================
   RESULT
========================= */

#result {

    position: fixed;

    inset: 0;

    display: none;

    align-items: center;

    justify-content: center;

    background:
        rgba(0,0,0,0.85);

    color: white;

    z-index: 100;
}

#result h1 {

    font-size: 60px;
}

</style>

</head>


<body>


<div id="menu">

    <div class="player-info">

        <img
            id="pfp"
            class="pfp"
        >

        <span id="playerName">
            Player
        </span>

    </div>


    <div id="coins">
        0 BC
    </div>


    <div
        id="menuBall"
        class="menu-ball"
        onclick="toggleBallSelector()"
    ></div>


    <div id="ballSelector">

        <button
            id="normalOption"
            class="ball-option selected"
            onclick="selectBall('normal')"
        ></button>

        <button
            id="bowlingOption"
            class="ball-option bowling-option"
            onclick="selectBall('bowling')"
        ></button>

        <button
            id="pingpongOption"
            class="ball-option pingpong-option"
            onclick="selectBall('pingpong')"
        ></button>

    </div>


    <div id="shop">

        <h2>
            Baaaaall Shop
        </h2>


        <div class="shop-item">

            <div>
                Bowling Baaaaall<br>
                <small>
                    0.2 speed · 10 push
                </small>
            </div>

            <button
                id="buyBowling"
                onclick="buyBall('bowling')"
            >
                250 BC
            </button>

        </div>


        <div class="shop-item">

            <div>
                PingPong Baaaaall<br>
                <small>
                    0.6 speed · 0.6 push
                </small>
            </div>

            <button
                id="buyPingpong"
                onclick="buyBall('pingpong')"
            >
                250 BC
            </button>

        </div>

    </div>


    <button
        class="start"
        onclick="play()"
    >
        PLAY
    </button>

</div>


<div id="matching">

    <h1>
        Matching...
    </h1>

    <p id="matchCount">
        1/2
    </p>

</div>


<div id="arena">

    <div id="camera">

        <div id="platform"></div>

    </div>


    <div id="joystick">

        <div id="stick"></div>

    </div>

</div>


<div id="result">

    <h1 id="resultText">
        YOU WIN!
    </h1>

</div>


<script>


const tg =
    window.Telegram.WebApp;


tg.ready();

tg.expand();


if (tg.requestFullscreen) {

    tg.requestFullscreen();

}


const user =
    tg.initDataUnsafe?.user;


let playerName =
    "Player";


if (user) {

    playerName =
        user.first_name ||
        "Player";


    if (user.last_name) {

        playerName +=
            " " +
            user.last_name;

    }


    document.getElementById(
        "playerName"
    ).textContent =
        playerName;


    if (user.photo_url) {

        document.getElementById(
            "pfp"
        ).src =
            user.photo_url;

    }

}


/* =========================
   PLAYER DATA
========================= */

let coins = 0;

let selectedBall = "normal";

let ownedBalls = {
    normal: true,
    bowling: false,
    pingpong: false
};


/* =========================
   CLOUD STORAGE
========================= */

function loadData() {

    if (
        !tg.CloudStorage
    ) {

        console.warn(
            "Telegram CloudStorage unavailable"
        );

        return;

    }


    tg.CloudStorage.getItems(
        [
            "brawl_coins",
            "brawl_owned",
            "brawl_selected"
        ],

        (
            error,
            values
        ) => {

            if (error) {

                console.warn(
                    error
                );

                return;

            }


            if (
                values.brawl_coins
            ) {

                coins =
                    parseInt(
                        values.brawl_coins
                    ) || 0;

            }


            if (
                values.brawl_owned
            ) {

                try {

                    ownedBalls =
                        JSON.parse(
                            values.brawl_owned
                        );

                } catch {

                    ownedBalls = {
                        normal: true,
                        bowling: false,
                        pingpong: false
                    };

                }

            }


            if (
                values.brawl_selected &&
                ownedBalls[
                    values.brawl_selected
                ]
            ) {

                selectedBall =
                    values.brawl_selected;

            }


            updateUI();

        }
    );

}


function saveData() {

    if (
        !tg.CloudStorage
    ) {

        return;

    }


    tg.CloudStorage.setItem(
        "brawl_coins",
        String(coins)
    );


    tg.CloudStorage.setItem(
        "brawl_owned",
        JSON.stringify(
            ownedBalls
        )
    );


    tg.CloudStorage.setItem(
        "brawl_selected",
        selectedBall
    );

}


/* =========================
   UI
========================= */

function updateUI() {

    document.getElementById(
        "coins"
    ).textContent =
        coins + " BC";


    const ball =
        document.getElementById(
            "menuBall"
        );


    ball.className =
        "menu-ball";


    if (
        selectedBall ===
        "bowling"
    ) {

        ball.classList.add(
            "bowling-option"
        );

    }


    if (
        selectedBall ===
        "pingpong"
    ) {

        ball.classList.add(
            "pingpong-option"
        );

    }


    document.getElementById(
        "buyBowling"
    ).disabled =
        ownedBalls.bowling ||
        coins < 250;


    document.getElementById(
        "buyPingpong"
    ).disabled =
        ownedBalls.pingpong ||
        coins < 250;


    document.getElementById(
        "buyBowling"
    ).textContent =
        ownedBalls.bowling
            ? "OWNED"
            : "250 BC";


    document.getElementById(
        "buyPingpong"
    ).textContent =
        ownedBalls.pingpong
            ? "OWNED"
            : "250 BC";


    document.getElementById(
        "normalOption"
    ).style.display =
        ownedBalls.normal
            ? "block"
            : "none";


    document.getElementById(
        "bowlingOption"
    ).style.display =
        ownedBalls.bowling
            ? "block"
            : "none";


    document.getElementById(
        "pingpongOption"
    ).style.display =
        ownedBalls.pingpong
            ? "block"
            : "none";

}


function toggleBallSelector() {

    const selector =
        document.getElementById(
            "ballSelector"
        );


    selector.style.display =
        selector.style.display ===
        "flex"
            ? "none"
            : "flex";

}


function selectBall(
    type
) {

    if (
        !ownedBalls[type]
    ) {

        return;

    }


    selectedBall =
        type;


    saveData();

    updateUI();


    document.getElementById(
        "ballSelector"
    ).style.display =
        "none";

}


function buyBall(
    type
) {

    if (
        ownedBalls[type]
    ) {

        return;

    }


    if (
        coins < 250
    ) {

        return;

    }


    coins -= 250;

    ownedBalls[type] =
        true;


    saveData();

    updateUI();

}


/* =========================
   LOAD SAVED DATA
========================= */

loadData();


/* =========================
   SERVER
========================= */

const SERVER_URL =
    "wss://brawlbaaaaalls.onrender.com/ws";


let socket = null;

let myID = null;

let players = {};

let running = false;


/* =========================
   CAMERA
========================= */

let cameraX = 0;

let cameraY = 0;

let cameraLimitX = 300;

let cameraLimitY = 300;


/* =========================
   PLAY
========================= */

function play() {

    document.getElementById(
        "menu"
    ).style.display =
        "none";


    document.getElementById(
        "matching"
    ).style.display =
        "flex";


    socket =
        new WebSocket(
            SERVER_URL
        );


    socket.onopen = () => {

        socket.send(
            JSON.stringify({

                type:
                    "player_info",

                name:
                    playerName,

                ball:
                    selectedBall

            })
        );


        socket.send(
            JSON.stringify({

                type:
                    "play"

            })
        );

    };


    socket.onmessage =
        event => {

            const data =
                JSON.parse(
                    event.data
                );


            if (
                data.type ===
                "waiting"
            ) {

                document.getElementById(
                    "matchCount"
                ).textContent =
                    "1/2";

            }


            if (
                data.type ===
                "match_found"
            ) {

                startArena(
                    data.players
                );

            }


            if (
                data.type ===
                "state"
            ) {

                updateState(
                    data.players
                );

            }


            if (
                data.type ===
                "game_over"
            ) {

                const won =
                    data.winner ===
                    myID;


                if (won) {

                    coins += 10;

                    saveData();

                }


                showResult(
                    won
                );

            }


            if (
                data.type ===
                "opponent_left"
            ) {

                coins += 10;

                saveData();

                showResult(true);

            }

        };


    socket.onclose = () => {

        if (running) {

            showResult(false);

        }

    };

}


/* =========================
   ARENA
========================= */

function startArena(
    list
) {

    document.getElementById(
        "matching"
    ).style.display =
        "none";


    document.getElementById(
        "arena"
    ).style.display =
        "block";


    players = {};


    /*
        First player in our
        match list is identified
        using our selected ball
        and name.
    */

    let mine =
        list.find(
            player =>
                player.name ===
                    playerName &&
                player.ball ===
                    selectedBall
        );


    if (!mine) {

        mine = list[0];

    }


    myID =
        mine.id;


    list.forEach(
        player => {

            const ball =
                createBall(
                    player
                );


            players[
                player.id
            ] = {

                element:
                    ball,

                x:
                    player.x,

                y:
                    player.y,

                vx: 0,

                vy: 0

            };

        }
    );


    if (players[myID]) {

        cameraX =
            players[myID].x;

        cameraY =
            players[myID].y;

    }


    running = true;


    requestAnimationFrame(
        render
    );

}


/* =========================
   CREATE BALL
========================= */

function createBall(
    player
) {

    const ball =
        document.createElement(
            "div"
        );


    ball.className =
        "ball " +
        player.ball;


    const name =
        document.createElement(
            "div"
        );


    name.className =
        "ball-name";


    name.textContent =
        player.name;


    ball.appendChild(
        name
    );


    document.getElementById(
        "camera"
    ).appendChild(
        ball
    );


    return ball;

}


/* =========================
   STATE
========================= */

function updateState(
    state
) {

    state.forEach(
        player => {

            if (
                players[
                    player.id
                ]
            ) {

                players[
                    player.id
                ].x =
                    player.x;

                players[
                    player.id
                ].y =
                    player.y;

                players[
                    player.id
                ].vx =
                    player.vx;

                players[
                    player.id
                ].vy =
                    player.vy;

            }

        }
    );

}


/* =========================
   CAMERA
========================= */

function render() {

    if (!running)
        return;


    const arena =
        document.getElementById(
            "arena"
        );


    const me =
        players[myID];


    if (!me) {

        requestAnimationFrame(
            render
        );

        return;

    }


    cameraX +=
        (
            me.x -
            cameraX
        ) * 0.12;


    cameraY +=
        (
            me.y -
            cameraY
        ) * 0.12;


    const centerX =
        arena.clientWidth / 2;


    const centerY =
        arena.clientHeight / 2;


    const platform =
        document.getElementById(
            "platform"
        );


    platform.style.left =
        (
            centerX -
            cameraX
        ) + "px";


    platform.style.top =
        (
            centerY -
            cameraY
        ) + "px";


    for (
        const id in players
    ) {

        const player =
            players[id];


        player.element.style.left =
            (
                centerX +
                player.x -
                cameraX
            ) + "px";


        player.element.style.top =
            (
                centerY +
                player.y -
                cameraY
            ) + "px";

    }


    requestAnimationFrame(
        render
    );

}


/* =========================
   JOYSTICK
========================= */

const joystick =
    document.getElementById(
        "joystick"
    );


const stick =
    document.getElementById(
        "stick"
    );


let joystickActive =
    false;


const JOYSTICK_CENTER =
    65;


const JOYSTICK_MAX =
    45;


function moveJoystick(
    x,
    y
) {

    const dx =
        x -
        JOYSTICK_CENTER;


    const dy =
        y -
        JOYSTICK_CENTER;


    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    let nx = dx;

    let ny = dy;


    if (
        distance >
        JOYSTICK_MAX
    ) {

        nx =
            dx /
            distance *
            JOYSTICK_MAX;

        ny =
            dy /
            distance *
            JOYSTICK_MAX;

    }


    stick.style.left =
        (
            JOYSTICK_CENTER +
            nx
        ) + "px";


    stick.style.top =
        (
            JOYSTICK_CENTER +
            ny
        ) + "px";


    if (
        socket &&
        socket.readyState ===
        WebSocket.OPEN
    ) {

        socket.send(
            JSON.stringify({

                type:
                    "input",

                x:
                    nx /
                    JOYSTICK_MAX,

                y:
                    ny /
                    JOYSTICK_MAX

            })
        );

    }

}


joystick.addEventListener(
    "touchstart",
    event => {

        joystickActive =
            true;

        event.preventDefault();

    },
    {
        passive: false
    }
);


joystick.addEventListener(
    "touchmove",
    event => {

        if (!joystickActive)
            return;


        const rect =
            joystick.getBoundingClientRect();


        const touch =
            event.touches[0];


        moveJoystick(

            touch.clientX -
            rect.left,

            touch.clientY -
            rect.top

        );


        event.preventDefault();

    },
    {
        passive: false
    }
);


function resetJoystick() {

    joystickActive =
        false;


    stick.style.left =
        "50%";


    stick.style.top =
        "50%";

}


joystick.addEventListener(
    "touchend",
    resetJoystick
);


joystick.addEventListener(
    "touchcancel",
    resetJoystick
);


/* =========================
   RESULT
========================= */

function showResult(
    won
) {

    running = false;


    document.getElementById(
        "resultText"
    ).textContent =
        won
            ? "YOU WIN! +10 BC"
            : "YOU LOSE! +0 BC";


    document.getElementById(
        "result"
    ).style.display =
        "flex";


    updateUI();


    setTimeout(
        () => {

            document.getElementById(
                "result"
            ).style.display =
                "none";


            document.getElementById(
                "arena"
            ).style.display =
                "none";


            document.getElementById(
                "menu"
            ).style.display =
                "block";


            for (
                const id in players
            ) {

                players[
                    id
                ].element.remove();

            }


            players = {};

            myID = null;

            cameraX = 0;

            cameraY = 0;

        },
        2000
    );

}

</script>

</body>

</html>
