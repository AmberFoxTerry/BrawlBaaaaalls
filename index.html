<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Brawl Baaaaalls</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: url("assets/ui/background.png") center center / cover no-repeat;
        }
    </style>
</head>

<body>

<script>
    document.addEventListener("click", async () => {
        if (document.documentElement.requestFullscreen) {
            try {
                await document.documentElement.requestFullscreen();
            } catch (error) {
                console.log("Fullscreen unavailable");
            }
        }
    }, { once: true });
</script>

</body>
</html>
