<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="
        width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no
    "
>

<title>Brawl Baaaaalls</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;

    user-select: none;
    -webkit-user-select: none;
}

html,
body {

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;

    font-family: Arial, sans-serif;
}


/* =================================
   MENU
================================= */

#menu {

    position: fixed;

    inset: 0;

    background: #2196f3;
}


.player-info {

    position: absolute;

    top: 15px;
    left: 15px;

    display: flex;

    align-items: center;

    gap: 10px;

    color: white;

    font-size: 18px;

    font-weight: bold;
}


.pfp {

    width: 50px;
    height: 50px;

    border-radius: 50%;

    object-fit: cover;

    background: white;
}


.menu-ball {

    position: absolute;

    width: 110px;
    height: 110px;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%, -50%);

    background: white;

    border-radius: 50%;
}


.start {

    position: absolute;

    right: 30px;
    bottom: 30px;

    width: 180px;
    height: 70px;

    border: none;

    border-radius: 18px;

    background: #ffd21f;

    color: #222;

    font-size: 28px;

    font-weight: bold;
}


/* =================================
   MATCHING
================================= */

#matching {

    position: fixed;

    inset: 0;

    display: none;

    align-items: center;

    justify-content: center;

    flex-direction: column;

    background: #000;

    color: white;
}


#matching h1 {

    font-size: 40px;

    margin-bottom: 15px;
}


#matching p {

    font-size: 26px;
}


/* =================================
   ARENA
================================= */

#arena {

    position: fixed;

    inset: 0;

    display: none;

    background: #000;

    overflow: hidden;

    touch-action: none;
}


/*
    Camera layer.

    The camera moves this layer.

    The platform itself does NOT move
    in world coordinates.
*/

#camera {

    position: absolute;

    left: 0;
    top: 0;

    width: 100%;
    height: 100%;

    pointer-events: none;
}


/* =================================
   PLATFORM
================================= */

#platform {

    position: absolute;

    left: 50%;
    top: 50%;

    width: min(800px, 90vw, 90vh);
    height: min(800px, 90vw, 90vh);

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background: #666;

    box-shadow:
        0 0 0 8px #444;
}


/* =================================
   BALL
================================= */

.ball {

    position: absolute;

    width: 70px;
    height: 70px;

    border-radius: 50%;

    transform:
        translate(-50%, -50%);

    z-index: 10;

    box-shadow:

        inset -10px -10px 15px
        rgba(0,0,0,0.25),

        inset 8px 8px 12px
        rgba(255,255,255,0.3);

    pointer-events: none;
}


/*
    Stripe makes the rotation visible.
*/

.ball-stripe {

    position: absolute;

    width: 14px;
    height: 70px;

    left: 28px;
    top: 0;

    border-radius: 50%;

    background:
        rgba(255,255,255,0.35);
}


/* =================================
   PLAYER NAME
================================= */

.ball-name {

    position: absolute;

    left: 50%;

    bottom: 78px;

    transform:
        translateX(-50%);

    color: white;

    font-size: 15px;

    font-weight: bold;

    white-space: nowrap;

    text-shadow:
        0 2px 4px #000;

    pointer-events: none;
}


/* =================================
   JOYSTICK
================================= */

#joystick {

    position: fixed;

    left: 35px;
    bottom: 35px;

    width: 130px;
    height: 130px;

    border-radius: 50%;

    background:
        rgba(255,255,255,0.15);

    border:
        3px solid
        rgba(255,255,255,0.3);

    z-index: 50;

    touch-action: none;
}


#stick {

    position: absolute;

    left: 50%;
    top: 50%;

    width: 60px;
    height: 60px;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background:
        rgba(255,255,255,0.6);
}


/* =================================
   RESULT
================================= */

#result {

    position: fixed;

    inset: 0;

    display: none;

    align-items: center;

    justify-content: center;

    background:
        rgba(0,0,0,0.85);

    color: white;

    z-index: 100;
}


#result h1 {

    font-size: 60px;
}

</style>

</head>


<body>


<!-- =================================
     MENU
================================= -->

<div id="menu">

    <div class="player-info">

        <img
            id="pfp"
            class="pfp"
        >

        <span id="playerName">
            Player
        </span>

    </div>


    <div class="menu-ball"></div>


    <button
        class="start"
        onclick="play()"
    >
        PLAY
    </button>

</div>


<!-- =================================
     MATCHING
================================= -->

<div id="matching">

    <h1>
        Matching...
    </h1>

    <p id="matchCount">
        1/2
    </p>

</div>


<!-- =================================
     ARENA
================================= -->

<div id="arena">


    <!-- CAMERA -->

    <div id="camera">

        <!-- FIXED PLATFORM -->

        <div id="platform"></div>

    </div>


    <!-- JOYSTICK -->

    <div id="joystick">

        <div id="stick"></div>

    </div>

</div>


<!-- =================================
     RESULT
================================= -->

<div id="result">

    <h1 id="resultText">
        YOU WIN!
    </h1>

</div>


<script>


/* =================================
   TELEGRAM
================================= */

const tg =
    window.Telegram.WebApp;


tg.ready();

tg.expand();


if (tg.requestFullscreen) {

    tg.requestFullscreen();

}


const user =
    tg.initDataUnsafe?.user;


let playerName =
    "Player";


if (user) {

    playerName =
        user.first_name ||
        "Player";


    if (user.last_name) {

        playerName +=
            " " +
            user.last_name;

    }


    document.getElementById(
        "playerName"
    ).textContent =
        playerName;


    if (user.photo_url) {

        document.getElementById(
            "pfp"
        ).src =
            user.photo_url;

    }

}


/* =================================
   SERVER
================================= */

const SERVER_URL =
    "wss://brawlbaaaaalls.onrender.com/ws";


let socket = null;

let myID = null;

let players = {};

let running = false;


/* =================================
   CAMERA
================================= */

let cameraX = 0;

let cameraY = 0;


/*
    Maximum camera movement.

    The camera moves around the
    arena, but the platform stays
    fixed in the world.
*/

let cameraLimitX = 0;

let cameraLimitY = 0;


/* =================================
   PLAY
================================= */

function play() {

    document.getElementById(
        "menu"
    ).style.display =
        "none";


    document.getElementById(
        "matching"
    ).style.display =
        "flex";


    socket =
        new WebSocket(
            SERVER_URL
        );


    socket.onopen = () => {


        socket.send(
            JSON.stringify({

                type:
                    "player_info",

                name:
                    playerName

            })
        );


        socket.send(
            JSON.stringify({

                type:
                    "play"

            })
        );

    };


    socket.onmessage =
        event => {

            const data =
                JSON.parse(
                    event.data
                );


            if (
                data.type ===
                "waiting"
            ) {

                document.getElementById(
                    "matchCount"
                ).textContent =
                    "1/2";

            }


            if (
                data.type ===
                "match_found"
            ) {

                startArena(
                    data.players
                );

            }


            if (
                data.type ===
                "state"
            ) {

                updateState(
                    data.players
                );

            }


            if (
                data.type ===
                "game_over"
            ) {

                showResult(
                    data.winner ===
                    myID
                );

            }


            if (
                data.type ===
                "opponent_left"
            ) {

                showResult(true);

            }

        };


    socket.onclose = () => {

        if (running) {

            showResult(false);

        }

    };

}


/* =================================
   START ARENA
================================= */

function startArena(
    list
) {

    document.getElementById(
        "matching"
    ).style.display =
        "none";


    document.getElementById(
        "arena"
    ).style.display =
        "block";


    players = {};


    /*
        Get actual platform size.
    */

    const platform =
        document.getElementById(
            "platform"
        );


    const platformSize =
        platform.offsetWidth;


    cameraLimitX =
        Math.max(
            0,
            platformSize / 2
        );


    cameraLimitY =
        Math.max(
            0,
            platformSize / 2
        );


    /*
        Create players.
    */

    list.forEach(
        player => {

            const ball =
                createBall(
                    player
                );


            players[
                player.id
            ] = {

                element:
                    ball,

                x:
                    player.x,

                y:
                    player.y,

                vx: 0,

                vy: 0

            };

        }
    );


    /*
        Find ourselves.
    */

    const mine =
        list.find(
            player =>
                player.name ===
                playerName
        );


    if (mine) {

        myID =
            mine.id;

    }


    /*
        Start camera at player.
    */

    if (players[myID]) {

        cameraX =
            players[myID].x;

        cameraY =
            players[myID].y;

    }


    running = true;


    requestAnimationFrame(
        render
    );

}


/* =================================
   CREATE BALL
================================= */

function createBall(
    player
) {

    const ball =
        document.createElement(
            "div"
        );


    ball.className =
        "ball";


    ball.style.background =
        player.color;


    const stripe =
        document.createElement(
            "div"
        );


    stripe.className =
        "ball-stripe";


    ball.appendChild(
        stripe
    );


    const name =
        document.createElement(
            "div"
        );


    name.className =
        "ball-name";


    name.textContent =
        player.name;


    ball.appendChild(
        name
    );


    document.getElementById(
        "camera"
    ).appendChild(
        ball
    );


    return ball;

}


/* =================================
   UPDATE STATE
================================= */

function updateState(
    state
) {

    state.forEach(
        player => {

            if (
                players[
                    player.id
                ]
            ) {

                players[
                    player.id
                ].x =
                    player.x;


                players[
                    player.id
                ].y =
                    player.y;


                players[
                    player.id
                ].vx =
                    player.vx;


                players[
                    player.id
                ].vy =
                    player.vy;

            }

        }
    );

}


/* =================================
   CAMERA + RENDER
================================= */

function render() {

    if (!running)
        return;


    const arena =
        document.getElementById(
            "arena"
        );


    const me =
        players[myID];


    if (!me) {

        requestAnimationFrame(
            render
        );

        return;

    }


    /*
        =================================
        CAMERA FOLLOWS PLAYER
        =================================

        The platform does NOT move.

        We simply offset the objects
        relative to the camera.
    */


    const targetCameraX =
        me.x;


    const targetCameraY =
        me.y;


    /*
        Smooth camera.
    */

    cameraX +=
        (
            targetCameraX -
            cameraX
        ) * 0.12;


    cameraY +=
        (
            targetCameraY -
            cameraY
        ) * 0.12;


    /*
        Camera limit.

        Don't let the camera travel
        infinitely away from the arena.
    */

    cameraX =
        Math.max(
            -cameraLimitX,
            Math.min(
                cameraLimitX,
                cameraX
            )
        );


    cameraY =
        Math.max(
            -cameraLimitY,
            Math.min(
                cameraLimitY,
                cameraY
            )
        );


    /*
        Screen center.
    */

    const centerX =
        arena.clientWidth / 2;


    const centerY =
        arena.clientHeight / 2;


    /*
        Platform screen position.

        IMPORTANT:

        The platform stays in WORLD
        coordinates.

        We only calculate where it
        appears through the camera.
    */

    const platform =
        document.getElementById(
            "platform"
        );


    platform.style.left =
        (
            centerX -
            cameraX
        ) + "px";


    platform.style.top =
        (
            centerY -
            cameraY
        ) + "px";


    /*
        Balls.
    */

    for (
        const id in players
    ) {

        const player =
            players[id];


        player.element.style.left =
            (
                centerX +
                player.x -
                cameraX
            ) + "px";


        player.element.style.top =
            (
                centerY +
                player.y -
                cameraY
            ) + "px";


        /*
            Rolling effect.
        */

        const speed =
            Math.sqrt(

                player.vx *
                player.vx +

                player.vy *
                player.vy

            );


        if (speed > 0.01) {

            const angle =
                Math.atan2(
                    player.vy,
                    player.vx
                ) *
                180 /
                Math.PI;


            player.element.style.transform =
                `
                translate(-50%, -50%)
                rotate(
                    ${angle + speed * 8}deg
                )
                `;

        }

    }


    requestAnimationFrame(
        render
    );

}


/* =================================
   JOYSTICK
================================= */

const joystick =
    document.getElementById(
        "joystick"
    );


const stick =
    document.getElementById(
        "stick"
    );


let joystickActive =
    false;


const JOYSTICK_CENTER =
    65;


const JOYSTICK_MAX =
    45;


function moveJoystick(
    x,
    y
) {

    const dx =
        x -
        JOYSTICK_CENTER;


    const dy =
        y -
        JOYSTICK_CENTER;


    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    let nx = dx;

    let ny = dy;


    if (
        distance >
        JOYSTICK_MAX
    ) {

        nx =
            dx /
            distance *
            JOYSTICK_MAX;


        ny =
            dy /
            distance *
            JOYSTICK_MAX;

    }


    stick.style.left =
        (
            JOYSTICK_CENTER +
            nx
        ) + "px";


    stick.style.top =
        (
            JOYSTICK_CENTER +
            ny
        ) + "px";


    if (
        socket &&
        socket.readyState ===
        WebSocket.OPEN
    ) {

        socket.send(
            JSON.stringify({

                type:
                    "input",

                x:
                    nx /
                    JOYSTICK_MAX,

                y:
                    ny /
                    JOYSTICK_MAX

            })
        );

    }

}


joystick.addEventListener(
    "touchstart",
    event => {

        joystickActive =
            true;

        event.preventDefault();

    },
    {
        passive: false
    }
);


joystick.addEventListener(
    "touchmove",
    event => {

        if (!joystickActive)
            return;


        const rect =
            joystick.getBoundingClientRect();


        const touch =
            event.touches[0];


        moveJoystick(

            touch.clientX -
            rect.left,

            touch.clientY -
            rect.top

        );


        event.preventDefault();

    },
    {
        passive: false
    }
);


function resetJoystick() {

    joystickActive =
        false;


    stick.style.left =
        "50%";


    stick.style.top =
        "50%";

}


joystick.addEventListener(
    "touchend",
    resetJoystick
);


joystick.addEventListener(
    "touchcancel",
    resetJoystick
);


/* =================================
   RESULT
================================= */

function showResult(
    won
) {

    running = false;


    document.getElementById(
        "resultText"
    ).textContent =
        won
            ? "YOU WIN!"
            : "YOU LOSE!";


    document.getElementById(
        "result"
    ).style.display =
        "flex";


    setTimeout(
        () => {

            document.getElementById(
                "result"
            ).style.display =
                "none";


            document.getElementById(
                "arena"
            ).style.display =
                "none";


            document.getElementById(
                "menu"
            ).style.display =
                "block";


            for (
                const id in players
            ) {

                players[
                    id
                ].element.remove();

            }


            players = {};

            myID = null;

            cameraX = 0;

            cameraY = 0;

        },
        2000
    );

}

</script>

</body>

</html>
