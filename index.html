<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Brawl Baaaaalls</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {

            width: 100%;
            height: 100%;

            overflow: hidden;

            background: #2196f3;

            font-family: Arial, sans-serif;
        }


        #game {

            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;
        }


        /* PLAYER */

        .player {

            position: absolute;

            top: 15px;
            left: 15px;

            display: flex;

            align-items: center;

            gap: 10px;

            color: white;

            font-size: 18px;

            font-weight: bold;

            z-index: 10;
        }


        .pfp {

            width: 50px;
            height: 50px;

            border-radius: 50%;

            object-fit: cover;

            background: white;
        }


        /* BALL */

        .ball {

            position: absolute;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            width: 110px;
            height: 110px;

            background: white;

            border-radius: 50%;

            box-shadow:
                0 8px 15px rgba(0, 0, 0, 0.2);
        }


        /* START BUTTON */

        .start-button {

            position: absolute;

            right: 30px;
            bottom: 30px;

            width: 180px;
            height: 70px;

            border: none;

            border-radius: 18px;

            background: #ffd21f;

            color: #222;

            font-size: 28px;

            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 6px 0 #c9a500;

            z-index: 10;
        }


        .start-button:active {

            transform: translateY(5px);

            box-shadow:
                0 1px 0 #c9a500;
        }

    </style>

</head>


<body>


    <div id="game">


        <!-- PLAYER -->

        <div class="player">

            <img
                id="pfp"
                class="pfp"
                alt=""
            >

            <span id="playerName">
                Player
            </span>

        </div>


        <!-- BALL -->

        <div class="ball"></div>


        <!-- START -->

        <button
            class="start-button"
            onclick="startGame()"
        >
            START
        </button>


    </div>


    <script>

        const tg = window.Telegram.WebApp;


        // Tell Telegram the game is ready

        tg.ready();


        // Expand the Mini App

        tg.expand();


        // Request fullscreen

        if (tg.requestFullscreen) {

            tg.requestFullscreen();

        }


        // =========================
        // TELEGRAM PLAYER
        // =========================

        const user =
            tg.initDataUnsafe?.user;


        if (user) {

            let name =
                user.first_name || "Player";


            if (user.last_name) {

                name +=
                    " " + user.last_name;

            }


            document.getElementById(
                "playerName"
            ).textContent = name;


            if (user.photo_url) {

                document.getElementById(
                    "pfp"
                ).src = user.photo_url;

            }

        }


        // =========================
        // START
        // =========================

        function startGame() {

            console.log(
                "BRAWL BAAAAALLS STARTED!"
            );

        }

    </script>

</body>

</html>
