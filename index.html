<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="
        width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no
    "
>

<title>Brawl Baaaaalls</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>


<style>

* {

    box-sizing: border-box;

    margin: 0;

    padding: 0;

    user-select: none;

    -webkit-user-select: none;
}


html,
body {

    width: 100%;

    height: 100%;

    overflow: hidden;

    background: #000;

    font-family: Arial, sans-serif;
}


/* =========================
   MENU
========================= */

#menu {

    position: fixed;

    inset: 0;

    background: #2196f3;
}


.player-info {

    position: absolute;

    top: 15px;

    left: 15px;

    display: flex;

    align-items: center;

    gap: 10px;

    color: white;

    font-size: 18px;

    font-weight: bold;
}


.pfp {

    width: 50px;

    height: 50px;

    border-radius: 50%;

    object-fit: cover;

    background: white;
}


.menu-ball {

    position: absolute;

    width: 110px;

    height: 110px;

    left: 50%;

    top: 50%;

    transform:
        translate(-50%, -50%);

    background: white;

    border-radius: 50%;
}


.start {

    position: absolute;

    right: 30px;

    bottom: 30px;

    width: 180px;

    height: 70px;

    border: none;

    border-radius: 18px;

    background: #ffd21f;

    font-size: 28px;

    font-weight: bold;
}


/* =========================
   MATCHING
========================= */

#matching {

    position: fixed;

    inset: 0;

    display: none;

    align-items: center;

    justify-content: center;

    flex-direction: column;

    background: #000;

    color: white;
}


#matching h1 {

    font-size: 40px;

    margin-bottom: 15px;
}


#matching p {

    font-size: 26px;
}


/* =========================
   ARENA
========================= */

#arena {

    position: fixed;

    inset: 0;

    display: none;

    background: #000;

    overflow: hidden;
}


/* =========================
   PLATFORM
========================= */

.platform {

    position: absolute;

    width: 800px;

    height: 800px;

    left: 50%;

    top: 50%;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background: #666;

    box-shadow:
        0 0 0 8px #444;
}


/* =========================
   BALL
========================= */

.ball {

    position: absolute;

    width: 70px;

    height: 70px;

    border-radius: 50%;

    transform:
        translate(-50%, -50%);

    z-index: 5;

    box-shadow:
        inset -8px -8px 12px
        rgba(0,0,0,0.25),

        inset 6px 6px 10px
        rgba(255,255,255,0.25);
}


.ball-name {

    position: absolute;

    bottom: 76px;

    left: 50%;

    transform:
        translateX(-50%);

    color: white;

    font-size: 15px;

    font-weight: bold;

    white-space: nowrap;

    text-shadow:
        0 2px 4px #000;
}


/* =========================
   JOYSTICK
========================= */

#joystick {

    position: fixed;

    left: 35px;

    bottom: 35px;

    width: 130px;

    height: 130px;

    border-radius: 50%;

    background:
        rgba(255,255,255,0.15);

    border:
        3px solid
        rgba(255,255,255,0.3);

    z-index: 20;

    touch-action: none;
}


#stick {

    position: absolute;

    left: 50%;

    top: 50%;

    width: 60px;

    height: 60px;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background:
        rgba(255,255,255,0.6);
}


/* =========================
   RESULT
========================= */

#result {

    position: fixed;

    inset: 0;

    display: none;

    align-items: center;

    justify-content: center;

    background:
        rgba(0,0,0,0.85);

    color: white;

    z-index: 100;
}


#result h1 {

    font-size: 60px;
}

</style>

</head>


<body>


<!-- =========================
     MENU
========================= -->

<div id="menu">

    <div class="player-info">

        <img
            id="pfp"
            class="pfp"
        >

        <span id="playerName">
            Player
        </span>

    </div>


    <div class="menu-ball"></div>


    <button
        class="start"
        onclick="play()"
    >
        PLAY
    </button>

</div>


<!-- =========================
     MATCHING
========================= -->

<div id="matching">

    <h1>Matching...</h1>

    <p id="matchCount">
        1/2
    </p>

</div>


<!-- =========================
     ARENA
========================= -->

<div id="arena">

    <div class="platform"></div>


    <div id="joystick">

        <div id="stick"></div>

    </div>

</div>


<!-- =========================
     RESULT
========================= -->

<div id="result">

    <h1 id="resultText">
        YOU WIN!
    </h1>

</div>


<script>


/* =========================
   TELEGRAM
========================= */

const tg =
    window.Telegram.WebApp;


tg.ready();

tg.expand();


if (tg.requestFullscreen) {

    tg.requestFullscreen();

}


const user =
    tg.initDataUnsafe?.user;


let playerName =
    "Player";


if (user) {

    playerName =
        user.first_name ||
        "Player";


    if (user.last_name) {

        playerName +=
            " " +
            user.last_name;

    }


    document.getElementById(
        "playerName"
    ).textContent =
        playerName;


    if (user.photo_url) {

        document.getElementById(
            "pfp"
        ).src =
            user.photo_url;

    }

}


/* =========================
   SERVER
========================= */


/*
    PUT YOUR SERVER ADDRESS HERE.

    Example:

    wss://example.com/ws
*/


const SERVER_URL =
    "wss://brawlbaaaaalls.onrender.com/ws";


let socket = null;

let myID = null;

let players = {};

let running = false;


/* =========================
   PLAY
========================= */

function play() {

    document.getElementById(
        "menu"
    ).style.display =
        "none";


    document.getElementById(
        "matching"
    ).style.display =
        "flex";


    socket =
        new WebSocket(
            SERVER_URL
        );


    socket.onopen = () => {


        socket.send(
            JSON.stringify({

                type:
                    "player_info",

                name:
                    playerName

            })
        );


        socket.send(
            JSON.stringify({

                type:
                    "play"

            })
        );

    };


    socket.onmessage =
        event => {

            const data =
                JSON.parse(
                    event.data
                );


            if (
                data.type ===
                "waiting"
            ) {

                document.getElementById(
                    "matchCount"
                ).textContent =
                    "1/2";

            }


            if (
                data.type ===
                "match_found"
            ) {

                startArena(
                    data.players
                );

            }


            if (
                data.type ===
                "state"
            ) {

                updateState(
                    data.players
                );

            }


            if (
                data.type ===
                "game_over"
            ) {

                showResult(
                    data.winner ===
                    myID
                );

            }


            if (
                data.type ===
                "opponent_left"
            ) {

                showResult(true);

            }

        };

}


/* =========================
   ARENA
========================= */

function startArena(
    list
) {

    document.getElementById(
        "matching"
    ).style.display =
        "none";


    document.getElementById(
        "arena"
    ).style.display =
        "block";


    players = {};


    list.forEach(
        player => {

            const ball =
                createBall(
                    player
                );


            players[player.id] = {

                element:
                    ball,

                x:
                    player.x,

                y:
                    player.y,

                vx: 0,

                vy: 0

            };

        }
    );


    /*
        The first player in
        the list is our ID
        if their name matches.
    */

    const mine =
        list.find(
            player =>
                player.name ===
                playerName
        );


    if (mine) {

        myID =
            mine.id;

    }


    running = true;

    requestAnimationFrame(
        render
    );

}


/* =========================
   CREATE BALL
========================= */

function createBall(
    player
) {

    const ball =
        document.createElement(
            "div"
        );


    ball.className =
        "ball";


    ball.style.background =
        player.color;


    const name =
        document.createElement(
            "div"
        );


    name.className =
        "ball-name";


    name.textContent =
        player.name;


    ball.appendChild(
        name
    );


    document.getElementById(
        "arena"
    ).appendChild(
        ball
    );


    return ball;

}


/* =========================
   STATE
========================= */

function updateState(
    state
) {

    state.forEach(
        player => {

            if (
                players[player.id]
            ) {

                players[
                    player.id
                ].x =
                    player.x;


                players[
                    player.id
                ].y =
                    player.y;


                players[
                    player.id
                ].vx =
                    player.vx;


                players[
                    player.id
                ].vy =
                    player.vy;

            }

        }
    );

}


/* =========================
   RENDER
========================= */

function render() {

    if (!running)
        return;


    const arena =
        document.getElementById(
            "arena"
        );


    const centerX =
        arena.clientWidth / 2;


    const centerY =
        arena.clientHeight / 2;


    for (
        const id in players
    ) {

        const player =
            players[id];


        player.element.style.left =
            (
                centerX +
                player.x
            ) +
            "px";


        player.element.style.top =
            (
                centerY +
                player.y
            ) +
            "px";

    }


    requestAnimationFrame(
        render
    );

}


/* =========================
   JOYSTICK
========================= */

const joystick =
    document.getElementById(
        "joystick"
    );


const stick =
    document.getElementById(
        "stick"
    );


let joystickActive =
    false;


let joystickCenter = 65;


function moveJoystick(
    x,
    y
) {

    const dx =
        x -
        joystickCenter;


    const dy =
        y -
        joystickCenter;


    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    const max =
        45;


    let nx = dx;

    let ny = dy;


    if (distance > max) {

        nx =
            dx /
            distance *
            max;

        ny =
            dy /
            distance *
            max;

    }


    stick.style.left =
        (
            joystickCenter +
            nx
        ) +
        "px";


    stick.style.top =
        (
            joystickCenter +
            ny
        ) +
        "px";


    if (
        socket &&
        socket.readyState ===
        WebSocket.OPEN
    ) {

        socket.send(
            JSON.stringify({

                type:
                    "input",

                x:
                    nx / max,

                y:
                    ny / max

            })
        );

    }

}


joystick.addEventListener(
    "touchstart",
    event => {

        joystickActive =
            true;

        event.preventDefault();

    },
    {
        passive: false
    }
);


joystick.addEventListener(
    "touchmove",
    event => {

        if (!joystickActive)
            return;


        const rect =
            joystick.getBoundingClientRect();


        const touch =
            event.touches[0];


        moveJoystick(

            touch.clientX -
            rect.left,

            touch.clientY -
            rect.top

        );


        event.preventDefault();

    },
    {
        passive: false
    }
);


function resetJoystick() {

    joystickActive =
        false;


    stick.style.left =
        "50%";


    stick.style.top =
        "50%";

}


joystick.addEventListener(
    "touchend",
    resetJoystick
);


joystick.addEventListener(
    "touchcancel",
    resetJoystick
);


/* =========================
   RESULT
========================= */

function showResult(
    won
) {

    running = false;


    document.getElementById(
        "resultText"
    ).textContent =
        won
            ? "YOU WIN!"
            : "YOU LOSE!";


    document.getElementById(
        "result"
    ).style.display =
        "flex";


    setTimeout(
        () => {

            document.getElementById(
                "result"
            ).style.display =
                "none";


            document.getElementById(
                "arena"
            ).style.display =
                "none";


            document.getElementById(
                "menu"
            ).style.display =
                "block";


            for (
                const id in players
            ) {

                players[
                    id
                ].element.remove();

            }


            players = {};

        },
        2000
    );

}

</script>

</body>

</html>
